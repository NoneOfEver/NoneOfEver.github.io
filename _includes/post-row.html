<li class="post-row">
  <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%b %d, %Y" }}</time>
  <div>
    <a class="post-title" href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a>
    {% if include.post.description %}
    <p class="post-summary">{{ include.post.description | escape }}</p>
    {% endif %}
  </div>
</li>
