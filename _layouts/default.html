<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/rss.xml' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <header class="shell site-header">
    <a class="wordmark" href="{{ '/' | relative_url }}">NoneOfEver<span>.</span></a>
    <nav lang="en" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/' | relative_url }}#projects">Projects</a>
      <a href="{{ '/archives/' | relative_url }}"{% if page.url == '/archives/' %} aria-current="page"{% endif %}>Blog</a>
      <a href="{{ '/assets/cv.pdf' | relative_url }}" download="潘泊名简历.pdf">CV</a>
    </nav>
  </header>
  <main id="main" class="shell">{{ content }}</main>
  <footer class="shell site-footer">
    <span>NoneOfEver</span>
    <div><a href="https://github.com/NoneOfEver">GitHub</a><a href="{{ '/rss.xml' | relative_url }}">RSS</a></div>
  </footer>
</body>
</html>
