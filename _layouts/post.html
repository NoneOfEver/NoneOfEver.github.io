---
layout: default
---
<article class="reading">
  <header class="page-heading">
    <div class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time> · {{ page.author | escape }}</div>
    <h1>{{ page.title | escape }}</h1>
  </header>
  <div class="prose">{{ content }}</div>
  <p class="back"><a href="{{ '/blog/' | relative_url }}">Back to Blog</a></p>
</article>
